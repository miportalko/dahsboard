<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Intelligence · Mi Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#E8241B; --dark:#0D0D0D; --ink:#16181d; --muted:#6b7280; --line:#e8e8ec;
  --bg:#F4F4F6; --card:#fff; --soft:#fafafb;
  --vip:#F5B400; --frec:#19A974; --nuevo:#3b82f6; --riesgo:#F5821F; --dorm:#9AA0A6; --ocas:#8b5cf6; --lead:#16b8c6;
  --ok:#19A974; --warn:#F5821F; --bad:#E8241B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
/* HEADER */
header{background:var(--dark);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.h-left{display:flex;align-items:center;gap:20px}
.h-logo{display:block;height:30px;cursor:pointer}
.h-mark{display:flex;align-items:center;gap:10px}
.h-dot{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;box-shadow:0 0 0 4px rgba(232,36,27,.18)}
.h-tit{color:#fff;font-family:'Bricolage Grotesque';font-weight:700;font-size:16px;line-height:1}
.h-sub{color:#8b8f98;font-size:11px;margin-top:3px}
.h-div{width:1px;height:28px;background:rgba(255,255,255,.1)}
.h-meta{color:#b7bbc2;font-size:11.5px}
.h-meta b{color:#fff;font-weight:600}
.h-right{display:flex;align-items:center;gap:10px}
.btn{font-family:'DM Sans';font-weight:600;font-size:12.5px;border:none;border-radius:9px;padding:9px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c91d15}
.btn-ghost{background:rgba(255,255,255,.09);color:#e6e7ea}.btn-ghost:hover{background:rgba(255,255,255,.17)}
.btn-out{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-out:hover{border-color:#bbb}
/* TABS */
.tabs{display:flex;gap:4px;padding:14px 24px 0;background:var(--bg);position:sticky;top:60px;z-index:150;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font-weight:600;font-size:13px;color:var(--muted);padding:9px 15px;border-radius:9px 9px 0 0;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--ink);background:rgba(0,0,0,.03)}
.tab.on{color:var(--red);border-bottom-color:var(--red);background:#fff}
/* FILTERS */
.filters{display:flex;gap:10px;align-items:flex-end;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:111px;z-index:140}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fl input,.fl select{font-family:'DM Sans';font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:120px}
.fl input:focus,.fl select:focus{outline:none;border-color:var(--red)}
.fl-reset{color:var(--red);font-size:12px;font-weight:600;cursor:pointer;padding:8px 4px;align-self:flex-end}
.wrap{padding:22px 24px 60px;max-width:1500px;margin:0 auto}
.sec{display:none;animation:fade .4s}
.sec.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-h{font-size:21px;font-weight:800;margin-bottom:3px}
.sec-d{color:var(--muted);font-size:13px;margin-bottom:18px}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;animation:rise .5s both}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.kpi.k2::before{background:var(--nuevo)}.kpi.k3::before{background:var(--frec)}.kpi.k4::before{background:var(--vip)}
.kpi.k5::before{background:var(--riesgo)}.kpi.k6::before{background:var(--ocas)}
.kpi .kl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .kv{font-family:'Bricolage Grotesque';font-weight:800;font-size:27px;margin-top:6px;line-height:1}
.kpi .kx{font-size:11.5px;color:var(--muted);margin-top:6px}
.kpi .kx b{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* CARDS / GRID */
.row{display:grid;gap:14px;margin-bottom:14px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r23{grid-template-columns:2fr 1fr}.r32{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-t{font-size:14.5px;font-weight:700}
.card-s{font-size:11.5px;color:var(--muted)}
.chartbox{position:relative;height:280px}
.chartbox.sm{height:230px}
.chartbox.lg{height:340px}
/* TABLE */
.tablebar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search{font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;min-width:220px}
.search:focus{outline:none;border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid #f1f1f4;white-space:nowrap}
tr:hover td{background:var(--soft)}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;color:#fff}
.av{width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-right:8px;vertical-align:middle}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 11px;cursor:pointer;font-weight:600}
.pager button:disabled{opacity:.4;cursor:default}
/* INSIGHTS */
.ins{display:flex;gap:12px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#fff,#fdf3f2);border:1px solid #f3dcd9;align-items:flex-start;animation:rise .5s both}
.ins .ic{width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0;font-size:17px}
.ins .it{font-size:13px;line-height:1.5}
.ins .it b{color:var(--red)}
.ins.g{background:linear-gradient(135deg,#fff,#eefaf4);border-color:#cfeede}.ins.g .ic{background:var(--frec)}.ins.g .it b{color:var(--frec)}
.ins.b{background:linear-gradient(135deg,#fff,#fff6ec);border-color:#f6e2c7}.ins.b .ic{background:var(--riesgo)}.ins.b .it b{color:var(--riesgo)}
.ins.n{background:linear-gradient(135deg,#fff,#eef4ff);border-color:#d4e1f7}.ins.n .ic{background:var(--nuevo)}.ins.n .it b{color:var(--nuevo)}
/* ALERTS */
.alert{display:flex;gap:14px;padding:16px;border-radius:13px;border:1px solid var(--line);background:#fff;align-items:center;border-left:5px solid var(--muted)}
.alert.sev3{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f4,#fff)}
.alert.sev2{border-left-color:var(--warn);background:linear-gradient(90deg,#fff9f1,#fff)}
.alert.sev1{border-left-color:var(--nuevo);background:linear-gradient(90deg,#f3f7ff,#fff)}
.alert .ai{font-size:24px}
.alert .at{font-weight:700;font-size:14px}
.alert .ad{color:var(--muted);font-size:12.5px;margin-top:2px}
.alert .av2{margin-left:auto;text-align:right}
.alert .av2 .n{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px}
.alert .av2 .l{font-size:11px;color:var(--muted)}
/* SEG LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.barseg{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 2px}
.barseg div{height:100%}
/* DROP */
#drop.drag{outline:3px dashed var(--red);outline-offset:-8px;background:#fff4f3}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:24px}
@media(max-width:860px){.r2,.r3,.r23,.r32{grid-template-columns:1fr}.h-meta,.h-sub{display:none}}
</style>
</head>

<script>

let REF = new Date(); REF.setHours(12,0,0,0);
const SEGS = ["VIP","Frecuentes","Nuevos","En riesgo","Dormidos","Ocasionales"];
const SEGCOL = {"VIP":"var(--vip)","Frecuentes":"var(--frec)","Nuevos":"var(--nuevo)","En riesgo":"var(--riesgo)","Dormidos":"var(--dorm)","Ocasionales":"var(--ocas)","Lead":"var(--lead)"};
const SEGHEX = {"VIP":"#F5B400","Frecuentes":"#19A974","Nuevos":"#3b82f6","En riesgo":"#F5821F","Dormidos":"#9AA0A6","Ocasionales":"#8b5cf6","Lead":"#16b8c6"};
const STCOL = {"Activo":"#19A974","En riesgo":"#F5821F","Dormido":"#9AA0A6","Lead":"#3b82f6"};

/* ---------- helpers ---------- */
const fN = n => (n||0).toLocaleString("es-PY",{maximumFractionDigits:0});
const fG = n => "Gs. "+fN(Math.round(n||0));
const fM = n => { n=n||0; if(Math.abs(n)>=1e9) return "Gs. "+(n/1e9).toLocaleString("es-PY",{maximumFractionDigits:2})+"B"; if(Math.abs(n)>=1e6) return "Gs. "+(n/1e6).toLocaleString("es-PY",{maximumFractionDigits:1})+"M"; return fG(n);};
const fP = n => (n||0).toLocaleString("es-PY",{maximumFractionDigits:1})+"%";
function pd(s){ if(!s) return null; s=(""+s).trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3],12);
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1],12);
  const d=new Date(s); return isNaN(d)?null:d; }
function pnum(x){ if(x==null) return 0; if(typeof x==="number") return x; let s=(""+x).trim().replace(/\s/g,""); if(!s) return 0;
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1){ s=s.replace(/\./g,"").replace(",","."); }
  else if(s.indexOf(",")>-1){ s=s.replace(",","."); }
  const v=parseFloat(s.replace(/[^0-9.\-]/g,"")); return isNaN(v)?0:v; }
const days = (a,b)=> Math.round((b-a)/86400000);
const ym = d => d? d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0") : null;
function toast(t){ const e=document.getElementById("toast"); e.textContent=t; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),2600); }
function dl(name,content,type){ const b=new Blob([content],{type:type||"text/plain;charset=utf-8"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }

/* ---------- data pipeline ---------- */
let ALL=[]; // all contacts (with derived)

// upload normalizer: map arbitrary headers -> contact
function findKey(keys,opts){ for(const o of opts){ const k=keys.find(k=>k.toLowerCase().replace(/[\s_\-]/g,"")===o); if(k) return k;} 
  for(const o of opts){ const k=keys.find(k=>k.toLowerCase().includes(o)); if(k) return k;} return null; }
function normalizeRecords(recs){
  if(!recs.length) return [];
  const keys=Object.keys(recs[0]);
  const K={
    fn:findKey(keys,["firstname","first_name","nombre","name"]),
    ln:findKey(keys,["lastname","last_name","apellido"]),
    email:findKey(keys,["email","correo","mail"]),
    gender:findKey(keys,["gender","genero","sexo"]),
    city:findKey(keys,["city","ciudad","localidad"]),
    created:findKey(keys,["createtime","fechadealta","fecha_alta","alta","created","createdat"]),
    last:findKey(keys,["latestpurchase","ultimacompra","últimacompra","last_purchase","lastpurchase"]),
    tk:findKey(keys,["averageticket","ticketpromedio","average_ticket","ticket"]),
    ltv:findKey(keys,["ltv","montototal","total_gastado","totalgastado","montogastado","monetary","gastado"]),
    pur:findKey(keys,["cantidaddecompras","compras","frequency","purchases","numcompras"]),
    lat:findKey(keys,["latency","latencia"]),
    src:findKey(keys,["branchsource","branch_source","canal","channel","source"]),
    opt:findKey(keys,["optinvtex","opt-in-vtex","optin","opt_in","suscrito"]),
    state:findKey(keys,["estado","state","status"]),
  };
  return recs.map(r=>{
    const nm=((K.fn?r[K.fn]:"")+" "+(K.ln?r[K.ln]:"")).trim();
    const last=K.last?pd(r[K.last]):null;
    const tk=K.tk?pnum(r[K.tk]):0; let ltv=K.ltv?pnum(r[K.ltv]):0;
    const pur=K.pur?pnum(r[K.pur]):0;
    if(!ltv && tk && pur) ltv=tk*pur;
    const srcv=K.src?(""+r[K.src]).trim():"";
    return {name:nm||(K.email?r[K.email]:""), email:K.email?(""+r[K.email]).trim():"",
      gender:K.gender?((""+r[K.gender]).trim().toUpperCase().charAt(0)||"—"):"—",
      city:K.city?((""+r[K.city]).trim()||"—"):"—",
      created:K.created?(pd(r[K.created])?pd(r[K.created]).toISOString().slice(0,10):null):null,
      lastPurchase:last?last.toISOString().slice(0,10):null,
      avgTicket:tk, ltv:ltv, _pur:pur||null,
      latency:K.lat?(pnum(r[K.lat])||null):null,
      source:(srcv && srcv.toLowerCase()!=="lead")?srcv:(last||ltv?"VTEX":"Lead"),
      optin:K.opt?["true","1","si","sí","yes"].includes((""+r[K.opt]).trim().toLowerCase()):false};
  }).filter(c=>c.email||c.name);
}
function quintiler(vals){ const s=[...vals].sort((a,b)=>a-b); const n=s.length;
  return v=>{ let lo=0,hi=n; while(lo<hi){const m=(lo+hi)>>1; if(s[m]<v) lo=m+1; else hi=m;} let q=Math.floor(lo/n*5)+1; return Math.min(5,Math.max(1,q)); };
}
function compute(contacts){
  contacts.forEach(c=>{
    c._cr=pd(c.created); c._lp=pd(c.lastPurchase);
    c.isClient = !!(c._lp || c.ltv>0);
    c.recency = c._lp? days(c._lp,REF) : null;
    c.tenure = c._cr? days(c._cr,REF) : null;
    c.purchases = c._pur!=null && c._pur>0 ? Math.round(c._pur)
                 : (c.avgTicket>0 ? Math.max(1,Math.round(c.ltv/c.avgTicket)) : (c.isClient?1:0));
    if(!c.isClient) c.state="Lead";
    else if(c.recency==null) c.state="Dormido";
    else if(c.recency<=90) c.state="Activo";
    else if(c.recency<=180) c.state="En riesgo";
    else c.state="Dormido";
  });
  const cli=contacts.filter(c=>c.isClient);
  if(cli.length){
    const qR=quintiler(cli.map(c=>c.recency==null?99999:c.recency));
    const qF=quintiler(cli.map(c=>c.purchases));
    const qM=quintiler(cli.map(c=>c.ltv));
    cli.forEach(c=>{
      c.R=6-qR(c.recency==null?99999:c.recency); c.F=qF(c.purchases); c.M=qM(c.ltv);
      const rec=c.recency==null?99999:c.recency, ten=c.tenure==null?9999:c.tenure;
      let seg;
      if(c.purchases<=1 && rec<=90 && ten<=150) seg="Nuevos";
      else if(c.R>=4 && c.F>=4 && c.M>=4) seg="VIP";
      else if(c.M>=4 && c.R<=2) seg="En riesgo";
      else if(c.F>=4 && c.R>=3) seg="Frecuentes";
      else if(c.R<=2) seg="Dormidos";
      else seg="Ocasionales";
      c.segment=seg;
    });
  }
  contacts.filter(c=>!c.isClient).forEach(c=>{ c.segment="Lead"; c.R=c.F=c.M=0;
    c.leadType = (c.optin && (c.tenure!=null && c.tenure<=90))?"Lead caliente":"Lead frío"; });
  return contacts;
}

/* ---------- filtering ---------- */
function getFilters(){ return {from:document.getElementById("f-from").value, to:document.getElementById("f-to").value,
  state:document.getElementById("f-state").value, seg:document.getElementById("f-seg").value,
  type:document.getElementById("f-type").value, q:document.getElementById("f-q").value.trim().toLowerCase()}; }
function applyFilters(){ const f=getFilters();
  return ALL.filter(c=>{
    if(f.from && (!c.created || c.created<f.from)) return false;
    if(f.to && (!c.created || c.created>f.to)) return false;
    if(f.state && c.state!==f.state) return false;
    if(f.seg && c.segment!==f.seg) return false;
    if(f.type==="cli" && !c.isClient) return false;
    if(f.type==="lead" && c.isClient) return false;
    if(f.q){ const h=(c.name+" "+c.email+" "+c.city).toLowerCase(); if(!h.includes(f.q)) return false; }
    return true;
  });
}

/* ---------- aggregations ---------- */
function agg(rows){
  const cli=rows.filter(c=>c.isClient), leads=rows.filter(c=>!c.isClient);
  const ingresos=cli.reduce((a,c)=>a+c.ltv,0);
  const tk = cli.length? cli.reduce((a,c)=>a+c.avgTicket,0)/cli.length : 0;
  const freq = cli.length? cli.reduce((a,c)=>a+c.purchases,0)/cli.length : 0;
  const st={Activo:0,"En riesgo":0,Dormido:0,Lead:0}; rows.forEach(c=>st[c.state]=(st[c.state]||0)+1);
  const seg={}; SEGS.forEach(s=>seg[s]=0); cli.forEach(c=>seg[c.segment]++);
  const segVal={}; SEGS.forEach(s=>segVal[s]=0); cli.forEach(c=>segVal[c.segment]+=c.ltv);
  return {rows,cli,leads,ingresos,tk,freq,st,seg,segVal,
    total:rows.length, nCli:cli.length, nLead:leads.length,
    activos:st.Activo, dormidos:st.Dormido, riesgo:st["En riesgo"]};
}
function byMonth(rows,dateField,valField){ const m={}; rows.forEach(c=>{ const d=c[dateField]; if(!d) return; const k=ym(d);
  if(!m[k]) m[k]={n:0,v:0}; m[k].n++; if(valField) m[k].v+=c[valField]||0; }); return m; }

function rComp(A){

  // ticket por segmento
  const tkSeg=SEGS.map(s=>{ const set=cli.filter(c=>c.segment===s); return set.length?set.reduce((a,c)=>a+c.avgTicket,0)/set.length:0; });
  // ciudades top
  const cityM={}; cli.forEach(c=>{ const k=c.city||"—"; if(!cityM[k])cityM[k]={n:0,v:0}; cityM[k].n++; cityM[k].v+=c.ltv; });
  const cityTop=Object.entries(cityM).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
  // genero
  const gen={M:{n:0,v:0},F:{n:0,v:0},"—":{n:0,v:0}}; cli.forEach(c=>{ const g=gen[c.gender]?c.gender:"—"; gen[g].n++; gen[g].v+=c.ltv; });
  const html=`

function rAlertas(A){
  const cli=A.cli;
  const riesgo=cli.filter(c=>c.segment==="En riesgo"); const riesgoV=riesgo.reduce((a,c)=>a+c.ltv,0);
  const dorm=cli.filter(c=>c.state==="Dormido"); const dormV=dorm.reduce((a,c)=>a+c.ltv,0);
  const leadsOld=A.leads.filter(c=>c.tenure!=null&&c.tenure>90);
  // caída de ventas: comparar últimos 2 meses cerrados por last purchase
  const m=byMonth(cli,"_lp","ltv"); const ks=Object.keys(m).sort();
  let drop=null;
  if(ks.length>=3){ const last=m[ks[ks.length-2]].v, prev=m[ks[ks.length-3]].v; if(prev>0){ const ch=(last-prev)/prev*100; drop={ch,last,prev,lm:ks[ks.length-2],pm:ks[ks.length-3]}; } }
  // segmento desaprovechado: el de más LTV por cliente vs su tamaño
  const ocas=cli.filter(c=>c.segment==="Ocasionales"); const ocasV=ocas.reduce((a,c)=>a+c.ltv,0);
  const al=[];
  if(riesgo.length) al.push([3,"⚠️","Clientes en riesgo de abandono",`${fN(riesgo.length)} clientes de buen valor llevan +90 días sin comprar. Priorizá una campaña de reactivación.`,fM(riesgoV),"LTV en riesgo"]);
  if(drop && drop.ch<0) al.push([3,"📉","Caída en ventas",`Los ingresos por última compra cayeron entre ${drop.pm.slice(2)} y ${drop.lm.slice(2)}.`,fP(Math.abs(drop.ch)),"caída mensual"]);
  else if(drop && drop.ch>=0) al.push([1,"📈","Ventas en alza",`Crecimiento de ingresos entre ${drop.pm.slice(2)} y ${drop.lm.slice(2)}. Buen momento para escalar.`,"+"+fP(drop.ch),"vs mes previo"]);
  if(leadsOld.length) al.push([2,"📭","Leads sin seguimiento",`${fN(leadsOld.length)} leads se dieron de alta hace +90 días y nunca compraron. Reactivá con una secuencia de nurturing.`,fN(leadsOld.length),"leads fríos"]);
  if(dorm.length) al.push([2,"😴","Clientes dormidos",`${fN(dorm.length)} clientes sin actividad reciente concentran LTV histórico recuperable.`,fM(dormV),"LTV dormido"]);
  if(ocas.length) al.push([1,"💡","Segmento ocasional con potencial",`${fN(ocas.length)} clientes ocasionales (${fM(ocasV)} LTV). Subí su frecuencia con cross-sell y combos.`,fN(ocas.length),"a desarrollar"]);
  if(!al.length) al.push([1,"✅","Todo en orden","No se detectaron alertas con los filtros actuales.","","",""]);
  document.getElementById("s-alertas").innerHTML=`
  <div class="sec-h">Alertas inteligentes</div><div class="sec-d">Detección automática de riesgos y oportunidades sobre tu base.</div>
  <div class="row" style="grid-template-columns:1fr;gap:12px">
  ${al.sort((a,b)=>b[0]-a[0]).map(a=>`<div class="alert sev${a[0]}"><div class="ai">${a[1]}</div><div><div class="at">${a[2]}</div><div class="ad">${a[3]}</div></div>${a[4]?`<div class="av2"><div class="n num">${a[4]}</div><div class="l">${a[5]}</div></div>`:""}</div>`).join("")}
  </div>`;
}

/* ---------- utils render ---------- */
function esc(s){ return (""+(s||"")).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function avatar(c){ const col=SEGHEX[c.segment]||"#9AA0A6"; const i=((c.name||c.email||"?").trim()[0]||"?").toUpperCase(); return `<span class="av" style="background:${col}">${esc(i)}</span>`; }

/* ---------- export ---------- */
function exportTable(){ const rows=applyFilters().filter(c=>c.isClient).sort((a,b)=>b.ltv-a.ltv);
  const head=["Nombre","Email","Ciudad","Segmento","Estado","R","F","M","Compras","Recencia_dias","Ticket_prom","LTV"];
  const lines=[head.join(",")].concat(rows.map(c=>[q(c.name),q(c.email),q(c.city),c.segment,c.state,c.R,c.F,c.M,c.purchases,c.recency==null?"":c.recency,Math.round(c.avgTicket),Math.round(c.ltv)].join(",")));
  dl("clientes_segmentados.csv","\ufeff"+lines.join("\n"),"text/csv;charset=utf-8"); toast("CSV exportado");
  function q(s){ s=""+(s||""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
}
/* ---------- export CSV / XLSX ---------- */
function getSaludExportData(){
  const rows = applyFilters();
  return rows.map(c => ({
    'Nombre': c.name || '',
    'Email': c.email || '',
    'Teléfono': c.phone || '',
    'Ciudad': c.city || '',
    'Tipo': c.isClient ? 'Cliente' : 'Lead',
    'Estado': c.state || '',
    'Segmento': c.segment || '',
    'Compras': c.purchases || 0,
    'LTV (₲)': c.ltv || 0,
    'Recencia (días)': c.recency != null ? c.recency : '',
    'Ticket Promedio (₲)': c.purchases ? Math.round((c.ltv||0)/c.purchases) : 0,
    'Fecha Alta': c._cr || ''
  }));
}
function exportSaludCSV(){
  const rows = getSaludExportData();
  if(!rows.length){ toast('Sin datos para exportar'); return; }
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(';'), ...rows.map(r => headers.map(h => {
    const v = r[h]; const s = String(v ?? '').replace(/"/g,'""');
    return s.includes(';')||s.includes('"')||s.includes('\n') ? `"${s}"` : s;
  }).join(';'))].join('\n');
  dl_blob('\uFEFF'+csv, 'text/csv;charset=utf-8;', `base_clientes_${new Date().toISOString().slice(0,10)}.csv`);
  toast('CSV exportado');
}
function exportSaludXLSX(){
  const rows = getSaludExportData();
  if(!rows.length){ toast('Sin datos para exportar'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(h => ({ wch: Math.max(h.length, 12) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Base Contactos');
  // Second sheet: segment summary
  const A = agg(applyFilters());
  const segRows = Object.keys(A.seg).map(s => ({
    'Segmento': s,
    'Cantidad': A.seg[s],
    'LTV Total (₲)': A.segVal[s] || 0,
    'LTV Promedio (₲)': A.seg[s] ? Math.round((A.segVal[s]||0)/A.seg[s]) : 0
  }));
  if(segRows.length){
    const wsS = XLSX.utils.json_to_sheet(segRows);
    wsS['!cols'] = Object.keys(segRows[0]).map(h => ({ wch: Math.max(h.length, 16) }));
    XLSX.utils.book_append_sheet(wb, wsS, 'Resumen Segmentos');
  }
  XLSX.writeFile(wb, `base_clientes_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel exportado');
}
function dl_blob(content, type, filename){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  a.click(); URL.revokeObjectURL(url);
}

function exportAll(){ const A=agg(applyFilters());
  const sorted=[...A.cli].sort((a,b)=>b.ltv-a.ltv); const idx20=Math.ceil(sorted.length*.2); let top20=0; sorted.slice(0,idx20).forEach(c=>top20+=c.ltv);
  const L=[]; L.push("CUSTOMER INTELLIGENCE — INSIGHTS"); L.push("Generado: "+new Date().toLocaleString("es-PY")); L.push("Contactos analizados: "+fN(A.total)); L.push("");
  L.push("== RESUMEN =="); L.push("Clientes: "+fN(A.nCli)+" | Leads: "+fN(A.nLead));
  L.push("Ingresos (LTV): "+fG(A.ingresos)); L.push("Ticket promedio: "+fG(A.tk)); L.push("Frecuencia: "+A.freq.toFixed(1)+" compras/cliente");
  L.push("Conversión lead->cliente: "+fP(A.total?A.nCli/A.total*100:0)); L.push("");
  L.push("== PARETO =="); L.push("El 20% de clientes ("+fN(idx20)+") genera el "+fP(A.ingresos?top20/A.ingresos*100:0)+" de los ingresos."); L.push("");
  L.push("== SEGMENTOS =="); SEGS.forEach(s=>L.push(s+": "+fN(A.seg[s])+" clientes | "+fG(A.segVal[s])+" LTV"));
  L.push(""); L.push("== ALERTAS =="); 
  const riesgo=A.cli.filter(c=>c.segment==="En riesgo"); L.push("En riesgo: "+fN(riesgo.length)+" clientes ("+fG(riesgo.reduce((a,c)=>a+c.ltv,0))+")");
  const dorm=A.cli.filter(c=>c.state==="Dormido"); L.push("Dormidos: "+fN(dorm.length)+" ("+fG(dorm.reduce((a,c)=>a+c.ltv,0))+")");
  L.push("Leads sin seguimiento (+90d): "+fN(A.leads.filter(c=>c.tenure!=null&&c.tenure>90).length));
  dl("insights_customer_intelligence.txt",L.join("\n")); toast("Insights exportados");
}

document.getElementById("file").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; toast("Procesando "+f.name+"...");

  else { const rd=new FileReader(); rd.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:"array"}); const ws=wb.Sheets[wb.SheetNames[0]]; const recs=XLSX.utils.sheet_to_json(ws,{defval:""}); const c=normalizeRecords(recs); if(!c.length){toast("No se detectaron columnas válidas");return;} loadData(c,f.name); toast(fN(c.length)+" contactos cargados"); }catch(err){toast("Error leyendo Excel: "+err.message);} }; rd.readAsArrayBuffer(f); } });

/* ---------- conexión live a Google Sheets (gviz) ---------- */
const SHEET_ID = "1p7A8yRjDghj20RyiIrhENoNLfpWB_5vByzmKhWyx4n4";
const SHEET_GID = "1231598902";
function gvizCell(c){
  if(!c) return "";
  if(typeof c.v === "string" && /^Date\(/.test(c.v)){
    const m = c.v.match(/^Date\((\d+),(\d+),(\d+)/);
    if(m) return m[1]+"-"+String(+m[2]+1).padStart(2,"0")+"-"+String(+m[3]).padStart(2,"0");
  }
  if(c.v instanceof Date) return c.v.toISOString().slice(0,10);
  if(c.v==null) return (c.f!=null? c.f : "");
  return c.v;
}
async function fetchSheet(){
  const mf=document.getElementById("m-file");
  mf.textContent="conectando al Sheet…";
  try{
    const url = "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&headers=1&gid="+SHEET_GID+"&_ts="+Date.now();
    const res = await fetch(url,{cache:"no-store"});
    const txt = await res.text();
    const json = JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}")+1));
    const cols = json.table.cols; let rows = json.table.rows;
    // headers: labels del gviz; si vienen vacíos/genéricos, usar la primera fila como encabezado
    let labels = cols.map((c,ix)=> (c.label||"").trim());
    const generic = labels.every(l=>!l) || labels.every((l,ix)=> l===String.fromCharCode(65+ix%26));
    if(generic && rows.length){
      labels = rows[0].c.map(c=> (""+gvizCell(c)).trim());
      rows = rows.slice(1);
    }
    const recs = rows.map(r=>{
      const o={};
      labels.forEach((lab,ix)=>{ if(lab) o[lab]=gvizCell(r.c ? r.c[ix] : null); });
      return o;
    }).filter(o=>Object.values(o).some(v=>v!=="" && v!=null));
    const contacts = normalizeRecords(recs);
    if(!contacts.length){ toast("El Sheet no devolvió columnas reconocibles"); mf.textContent="sin datos del Sheet"; return; }
    loadData(contacts, "Sheet · Fuente Salud Base");
    toast(fN(contacts.length)+" contactos cargados desde Google Sheets");
  }catch(err){
    console.error(err);
    mf.textContent="error de conexión al Sheet";
    toast("No se pudo leer el Sheet — podés cargar un CSV/Excel manualmente");
  }
}

fetchSheet();
